# 项目元数据：发布插件会自动读取 GROUP / VERSION_NAME / POM_*，替换成自己的信息。
# 凭据与签名密钥不要写在这里，见 gradle.properties.example。
android.useAndroidX=true

GROUP=io.github.venshine
VERSION_NAME=1.0.0

POM_ARTIFACT_ID=maven-central-sample
POM_NAME=maven-central-sample
POM_DESCRIPTION=Minimal Android library showing how to publish to Maven Central
POM_URL=https://github.com/venshine/gradle-bintray-upload
POM_INCEPTION_YEAR=2016

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/venshine/gradle-bintray-upload
POM_SCM_CONNECTION=scm:git:git://github.com/venshine/gradle-bintray-upload.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/venshine/gradle-bintray-upload.git

POM_DEVELOPER_ID=venshine
POM_DEVELOPER_NAME=venshine
POM_DEVELOPER_URL=https://github.com/venshine
